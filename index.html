<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#08110b">
  <title>🌾 Làng Quê Việt — Ký Sự Đồng Quê 2D</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-red: #e11d48;
      --glass-bg: rgba(15, 23, 42, 0.88);
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-shadow: 0 10px 36px 0 rgba(0, 0, 0, 0.6);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
      --safe-top: env(safe-area-inset-top, 16px);
      --safe-left: env(safe-area-inset-left, 16px);
      --safe-right: env(safe-area-inset-right, 16px);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      font-family: 'Outfit', sans-serif;
    }
    html, body {
      background: #08110b;
      color: #f8fafc;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: fixed;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Glassmorphism Classes */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 16px;
    }

    /* Floating Toast */
    #toast {
      position: absolute;
      top: calc(var(--safe-top) + 12px);
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 13.5px;
      font-weight: 700;
      color: #fef08a;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      z-index: 120;
      max-width: 90vw;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Top Controls Bar (Desktop & Tablet) */
    #top-bar {
      position: absolute;
      top: calc(var(--safe-top) + 10px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 80;
      align-items: center;
      max-width: calc(100vw - 32px);
    }
    .top-btn {
      padding: 8px 16px;
      font-size: 12.5px;
      font-weight: 700;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .top-btn:hover {
      color: #f8fafc;
      border-color: #38bdf8;
      transform: translateY(-1px);
    }
    .top-btn:active {
      transform: scale(0.95);
    }
    .top-btn.active {
      color: #fde047;
      border-color: #facc15;
      background: rgba(30, 41, 59, 0.95);
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.35);
    }

    /* Mobile Quick Settings Menu Toggle */
    #btn-mobile-menu {
      display: none;
    }
    #mobile-dropdown {
      display: none;
      position: absolute;
      top: calc(var(--safe-top) + 52px);
      right: calc(var(--safe-right) + 12px);
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      z-index: 95;
      min-width: 190px;
    }
    #mobile-dropdown.open {
      display: flex;
      animation: fadeInDown 0.2s ease forwards;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================ */
    /* VIRTUAL TOUCH CONTROLLERS (ERGONOMIC 2-THUMB LAYOUT) */
    /* ============================================================ */
    
    /* Left Thumb D-Pad */
    #touch-controls {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 16px);
      left: calc(var(--safe-left) + 16px);
      display: flex;
      gap: 14px;
      z-index: 90;
    }
    .touch-dpad-btn {
      width: 66px;
      height: 66px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.92), rgba(15, 23, 42, 0.95));
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #f8fafc;
      font-size: 24px;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transition: transform 0.08s ease, background 0.08s ease, border-color 0.08s ease;
      touch-action: none;
    }
    .touch-dpad-btn.pressed, .touch-dpad-btn:active {
      transform: scale(0.90);
      background: linear-gradient(145deg, #0284c7, #0369a1);
      border-color: #38bdf8;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.6);
    }

    /* Right Action Cluster */
    #action-buttons {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 16px);
      right: calc(var(--safe-right) + 16px);
      display: flex;
      align-items: flex-end;
      gap: 12px;
      z-index: 90;
    }
    .action-sub-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }
    .touch-action-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 12px 18px;
      color: #f8fafc;
      font-weight: 800;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transition: transform 0.08s ease, border-color 0.08s ease, background 0.08s ease;
      touch-action: none;
      white-space: nowrap;
    }
    .touch-action-btn.pressed, .touch-action-btn:active {
      transform: scale(0.92);
    }

    /* Jump Button (Big, Ergonomic) */
    .touch-jump-btn {
      width: 72px;
      height: 72px;
      border-radius: 26px;
      background: linear-gradient(135deg, #10b981, #059669);
      border: 2.5px solid #34d399;
      font-size: 26px;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 22px rgba(16, 185, 129, 0.45);
    }
    .touch-jump-btn.pressed, .touch-jump-btn:active {
      transform: scale(0.88);
      background: linear-gradient(135deg, #059669, #047857);
      box-shadow: 0 0 24px rgba(52, 211, 153, 0.7);
    }

    /* PC Guide Pill (Auto-hidden on small touch screens) */
    #guide-pill {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 8px);
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
      color: #94a3b8;
      pointer-events: none;
      z-index: 40;
      white-space: nowrap;
    }

    /* ============================================================ */
    /* ORIENTATION ROTATION NOTICE (FOR PORTRAIT MOBILE DEVICES) */
    /* ============================================================ */
    #orientation-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 17, 11, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 200;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }
    .phone-rotate-icon {
      font-size: 52px;
      margin-bottom: 16px;
      animation: rotatePhone 2.2s infinite ease-in-out;
    }
    @keyframes rotatePhone {
      0% { transform: rotate(0deg); }
      40% { transform: rotate(-90deg); }
      70% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }
    .orient-title {
      font-size: 20px;
      font-weight: 800;
      color: #fde047;
      margin-bottom: 8px;
    }
    .orient-desc {
      font-size: 13.5px;
      color: #94a3b8;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .orient-dismiss-btn {
      padding: 10px 22px;
      border-radius: 22px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Show orientation notice on small screens in portrait mode */
    @media (orientation: portrait) and (max-width: 820px) {
      #orientation-overlay.active {
        display: flex;
      }
    }

    /* ============================================================ */
    /* MOBILE RESPONSIVE ADAPTATIONS (< 768px) */
    /* ============================================================ */
    @media (max-width: 768px) {
      #guide-pill {
        display: none;
      }
      #top-bar {
        left: calc(var(--safe-left) + 12px);
        transform: none;
      }
      .desktop-only-btn {
        display: none !important;
      }
      #btn-mobile-menu {
        display: flex;
      }
      .touch-dpad-btn {
        width: 60px;
        height: 60px;
        font-size: 22px;
      }
      .touch-jump-btn {
        width: 64px;
        height: 64px;
        font-size: 24px;
      }
      .touch-action-btn {
        padding: 10px 14px;
        font-size: 12.5px;
      }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Top Navigation Bar -->
    <div id="top-bar">
      <button class="top-btn active" id="tab-map1">🌾 Làng Quê</button>
      <button class="top-btn desktop-only-btn active" id="btn-toggle-grid" style="color: #38bdf8; border-color: #38bdf8;">📐 Thước Đo [G]</button>
      <button class="top-btn desktop-only-btn" id="btn-toggle-music" style="color: #4ade80; border-color: #4ade80;">🎵 Nhạc [M]</button>
      <button class="top-btn desktop-only-btn" id="btn-reset-world" style="color: #f87171; border-color: #f87171;" title="Đặt lại thế giới">🔄 Đặt Lại</button>
      <button class="top-btn desktop-only-btn" id="tab-studio">🎬 Studio</button>
      
      <!-- Mobile Quick Menu & Fullscreen Toggle -->
      <button class="top-btn" id="btn-fullscreen" title="Toàn Màn Hình" style="color: #38bdf8; border-color: #38bdf8;">⛶ Full</button>
      <button class="top-btn" id="btn-mobile-menu">⚙️ Menu</button>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div id="mobile-dropdown" class="glass-panel">
      <button class="top-btn active" id="m-btn-grid" style="color: #38bdf8; justify-content: center;">📐 Thước Đo Bản Đồ</button>
      <button class="top-btn" id="m-btn-music" style="color: #4ade80; justify-content: center;">🎵 Bật / Tắt Nhạc</button>
      <button class="top-btn" id="m-tab-studio" style="justify-content: center;">🎬 Studio Đo Hoạt Ảnh</button>
      <button class="top-btn" id="m-btn-reset" style="color: #f87171; border-color: #f87171; justify-content: center;">🔄 Đặt Lại Bản Đồ</button>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="glass-panel">Thông báo</div>

    <!-- Mobile Touch D-Pad (Left Thumb) -->
    <div id="touch-controls">
      <button class="touch-dpad-btn" id="btn-left" aria-label="Sang Trái">◀</button>
      <button class="touch-dpad-btn" id="btn-right" aria-label="Sang Phải">▶</button>
    </div>

    <!-- Mobile Touch Actions (Right Thumb) -->
    <div id="action-buttons">
      <div class="action-sub-group">
        <button class="touch-action-btn" id="btn-cycle-tool" style="background: rgba(2, 132, 199, 0.9); border-color: #38bdf8;">💧 [Q] Đổi Dụng Cụ</button>
        <button class="touch-action-btn" id="btn-use-tool" style="background: rgba(22, 163, 74, 0.9); border-color: #4ade80;">🌾 [E] Thao Tác</button>
      </div>
      <button class="touch-jump-btn touch-action-btn" id="btn-jump" aria-label="Nhảy / Leo Dốc">⬆</button>
    </div>

    <!-- PC Guide Pill -->
    <div id="guide-pill" class="glass-panel">
      🎮 Phím: [A / D] Đi lại · [W / Space] Nhảy · [E] Bứng / Trồng Chuối / Cấy / Gặt · [Q] Đổi Dụng Cụ · [M] Nhạc · [G] Thước Đo
    </div>

    <!-- Orientation Notice Overlay for Portrait Mode -->
    <div id="orientation-overlay" class="active">
      <div class="phone-rotate-icon">📱</div>
      <div class="orient-title">Xoay Ngang Màn Hình</div>
      <div class="orient-desc">Hãy xoay ngang điện thoại để khám phá toàn cảnh đồng quê Việt Nam tuyệt đẹp với góc nhìn rộng và dễ điều khiển nhất!</div>
      <button class="orient-dismiss-btn" id="btn-dismiss-orient">Tiếp tục chơi dọc</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
